name: Installeurs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Les machines macOS Intel de GitHub sont rares et longues à obtenir : les Mac Intel passent par la
        # page web ou la ligne de commande, en attendant un paquet universel construit sur Apple Silicon.
        include:
          - os: macos-latest
            label: macOS Apple Silicon
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:electron -- --publish never
        env:
          # Les applications ne sont pas signées : voir le README.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: installeurs-${{ matrix.os }}
          path: |
            dist-installers/*.dmg
            dist-installers/*.exe
            dist-installers/*.AppImage
          if-no-files-found: error

  publish:
    name: Publication dans la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installeurs
          merge-multiple: true
      # La release peut ne pas exister encore : le tag déclenche ce workflow aussitôt.
      - run: |
          gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$REPO" --title "${TAG#v}" --notes "Notes de version à compléter."
          gh release upload "$TAG" installeurs/* --clobber --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
