<svg xmlns="http://www.w3.org/2000/svg" width="900" height="282" viewBox="0 0 900 282" role="img" aria-label="Les services d'où viennent les données de la carte"><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5d6b79"/></marker></defs><rect width="900" height="282" rx="12" fill="#ffffff"/><rect x="340.0" y="20" width="220" height="60" rx="10" fill="#e8f4ee" stroke="#15814f" stroke-width="1.5"/><text x="450.0" y="46.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f6a40">cartes</text><text x="450.0" y="67.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d6b79">la carte de votre commune</text><rect x="20" y="130" width="200" height="132" rx="10" fill="#f5f7f9" stroke="#cfd7df" stroke-width="1.5"/><text x="34" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#17232f">Géoplateforme (IGN)</text><text x="34" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d6b79">fonds de carte, cadastre</text><text x="34" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d6b79">contour de la commune</text><text x="34" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d6b79">dates des données</text><text x="34" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d6b79">communes et adresses</text><path d="M120.0,126L390.0,86" stroke="#5d6b79" stroke-width="1.5" marker-end="url(#fl)"/><rect x="240" y="130" width="200" height="132" rx="10" fill="#f5f7f9" stroke="#cfd7df" stroke-width="1.5"/><text x="254" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fon