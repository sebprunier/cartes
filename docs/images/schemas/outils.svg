<svg xmlns="http://www.w3.org/2000/svg" width="900" height="368" viewBox="0 0 900 368" role="img" aria-label="Quatre outils, un cœur partagé, deux façons de dessiner"><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5d6b79"/></marker></defs><rect width="900" height="368" rx="12" fill="#ffffff"/><rect x="20" y="20" width="195" height="64" rx="10" fill="#ffffff" stroke="#cfd7df" stroke-width="1.5"/><text x="117.5" y="48.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17232f">Page web</text><text x="117.5" y="69.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d6b79">dans le navigateur</text><path d="M117.5,84V140" stroke="#5d6b79" stroke-width="1.5" marker-end="url(#fl)"/><rect x="235" y="20" width="195" height="64" rx="10" fill="#ffffff" stroke="#cfd7df" stroke-width="1.5"/><text x="332.5" y="48.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17232f">Application</text><text x="332.5" y="69.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d6b79">Windows, macOS, Linux</text><path d="M332.5,84V140" stroke="#5d6b79" stroke-width="1.5" marker-end="url(#fl)"/><rect x="450" y="20" width="195" height="64" rx="10" fill="#ffffff" stroke="#cfd7df" stroke-width="1.5"/><text x="547.5" y="48.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#17232f">Ligne de commande</text><text x="547.5" y="69.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d6b79">cartes generer</text><path d="M547.5,84V140" stroke="#5d6b79" stroke-width="1.5" marker-end="