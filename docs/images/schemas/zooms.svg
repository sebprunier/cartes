<svg xmlns="http://www.w3.org/2000/svg" width="870" height="324" viewBox="0 0 870 324" role="img" aria-label="Chaque niveau de zoom découpe le même carré en quatre fois plus de tuiles que le précédent"><defs><marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#15814f"/></marker></defs><rect width="870" height="324" rx="12" fill="#ffffff"/><rect x="30" y="40" width="150" height="150" fill="#eaf1f8" stroke="#0e4777" stroke-width="2"/><text x="105.0" y="220" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#17232f">zoom 0</text><text x="105.0" y="242" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5d6b79">1 tuile</text><path d="M192,115.0h40" stroke="#15814f" stroke-width="2.5" marker-end="url(#fleche)"/><text x="215.0" y="105.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15814f">× 4</text><rect x="250" y="40" width="150" height="150" fill="#eaf1f8" stroke="#0e4777" stroke-width="2"/><path d="M325.0,40V190M250,115.0H400" stroke="#0e4777" stroke-width="1.2"/><text x="325.0" y="220" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#17232f">zoom 1</text><text x="325.0" y="242" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5d6b79">4 tuiles</text><path d="M412,115.0h40" stroke="#15814f" stroke-width="2.5" marker-end="url(#fleche)"/><text x="435.0" y="105.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#15814f">× 4</text><rect x="470" y="40" width="150" height="150" fill="#eaf1f8" stroke="#0e4777" stroke-width="2"/><path d="M507.5,4