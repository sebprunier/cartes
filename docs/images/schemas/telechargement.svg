" stroke="#b3261e" stroke-width="1.5"/><text x="200" y="348" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#17232f">une erreur passagère</text><rect x="345" y="335" width="22" height="16" rx="3" fill="url(#attente)" stroke="#9aa6b2" stroke-width="1.5"/><text x="375" y="348" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#17232f">l’attente avant de réessayer : 1 s, puis 2 s, puis 4 s</text><text x="24" y="378" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5d6b79">Au bout de quatre essais manqués, la tuile reste blanche et l’outil le signale ; les autres continuent.</text></svg>